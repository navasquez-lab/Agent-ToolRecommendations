<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Which AI Agent Should You Recommend? — HubSpot Contracts</title>
<style>
  :root {
    --plum:     #5C1A5A;
    --lavender: #B57FBE;
    --coral:    #E8562A;
    --peach:    #F0855C;
    --navy:     #0D1E35;
    --cream:    #FAF5F0;
    --white:    #FFFFFF;
    --border:   #E9DFF5;
    --text-primary: #0D1E35;
    --text-secondary: #5A4A6A;
    --text-muted: #9B8AAA;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--cream);
    min-height: 100vh;
    padding: 2rem 1rem;
  }

  /* Header band */
  .top-band {
    background: linear-gradient(135deg, var(--plum) 0%, #8B3A8A 60%, var(--coral) 100%);
    border-radius: 20px 20px 0 0;
    padding: 2rem 2rem 1.5rem;
    position: relative;
    overflow: hidden;
  }
  .top-band::after {
    content:'';
    position:absolute;
    right:-40px;top:-40px;
    width:200px;height:200px;
    border-radius:50%;
    background: rgba(255,255,255,.07);
  }
  .top-band::before {
    content:'';
    position:absolute;
    right:60px;bottom:-60px;
    width:140px;height:140px;
    border-radius:50%;
    background: rgba(255,255,255,.05);
  }
  .brand-row {
    display:flex;align-items:center;gap:8px;margin-bottom:1rem;
  }
  .brand-dot { width:10px;height:10px;border-radius:50%;background:var(--peach); }
  .brand-label { font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.7); }
  .quiz-title { font-size:22px;font-weight:700;color:#fff;line-height:1.3;max-width:360px; }
  .quiz-sub { font-size:13px;color:rgba(255,255,255,.75);margin-top:.4rem;max-width:340px;line-height:1.5; }

  /* Card body */
  .card {
    background: var(--white);
    border-radius: 0 0 20px 20px;
    box-shadow: 0 8px 32px rgba(13,30,53,.1);
    padding: 1.75rem 2rem 1.75rem;
    max-width: 600px;
    margin: 0 auto;
  }
  .wrap { max-width:600px;margin:0 auto; }
  .top-band { max-width:600px;margin:0 auto; }

  /* Progress */
  .progress-wrap { margin-bottom:1.5rem; }
  .progress-meta { display:flex;justify-content:space-between;margin-bottom:.5rem; }
  .q-counter { font-size:12px;font-weight:700;color:var(--text-muted);letter-spacing:.05em;text-transform:uppercase; }
  .progress-track { height:5px;background:#F0EAF7;border-radius:3px;overflow:hidden; }
  .progress-fill { height:100%;border-radius:3px;background:linear-gradient(90deg,var(--plum),var(--coral));transition:width .4s ease; }

  /* Question */
  .q-text { font-size:17px;font-weight:600;color:var(--text-primary);line-height:1.45;margin-bottom:1.25rem; }
  .q-hint { font-size:13px;color:var(--text-muted);margin-top:-.75rem;margin-bottom:1rem;font-style:italic; }

  /* Options */
  .option {
    display:flex;align-items:flex-start;gap:10px;
    padding:.8rem 1rem;
    border:1.5px solid var(--border);
    border-radius:10px;
    margin-bottom:.5rem;
    cursor:pointer;
    transition:border-color .15s,background .15s;
  }
  .option:hover { border-color:var(--lavender);background:#FAF4FF; }
  .option.selected { border-color:var(--plum);background:#F5EDF9; }
  .option.multi { position:relative; }
  .check-box {
    width:18px;height:18px;border-radius:5px;
    border:1.5px solid #C8B8D8;flex-shrink:0;margin-top:1px;
    transition:all .15s;display:flex;align-items:center;justify-content:center;
  }
  .option.selected .check-box { background:var(--plum);border-color:var(--plum); }
  .option.selected .check-box::after { content:'✓';font-size:11px;color:#fff;font-weight:700; }
  .radio-dot {
    width:18px;height:18px;border-radius:50%;
    border:1.5px solid #C8B8D8;flex-shrink:0;margin-top:1px;
    transition:all .15s;display:flex;align-items:center;justify-content:center;
  }
  .option.selected .radio-dot { border-color:var(--plum); }
  .option.selected .radio-dot::after { content:'';width:8px;height:8px;border-radius:50%;background:var(--plum); }
  .option-text { font-size:14px;color:var(--text-primary);line-height:1.45; }
  .option-sub { font-size:12px;color:var(--text-muted);margin-top:2px; }

  /* Nav */
  .err { font-size:13px;color:var(--coral);margin-top:.5rem;min-height:18px; }
  .nav { display:flex;justify-content:space-between;align-items:center;margin-top:1.25rem; }
  .btn {
    display:inline-flex;align-items:center;gap:6px;
    padding:.6rem 1.4rem;border-radius:8px;
    font-size:14px;font-weight:600;cursor:pointer;
    transition:all .15s;border:none;
  }
  .btn-primary { background:linear-gradient(135deg,var(--plum),var(--coral));color:#fff; }
  .btn-primary:hover { opacity:.88; }
  .btn-ghost { background:transparent;color:var(--text-muted);border:1.5px solid var(--border); }
  .btn-ghost:hover { background:var(--cream);color:var(--text-primary); }

  /* Results */
  .result-header { text-align:center;padding:.75rem 0 1.5rem; }
  .result-emoji { font-size:36px;margin-bottom:.5rem; }
  .result-title { font-size:21px;font-weight:700;color:var(--text-primary);margin-bottom:.4rem; }
  .result-sub { font-size:14px;color:var(--text-secondary);line-height:1.6;max-width:440px;margin:0 auto 1.5rem; }

  .section-label {
    font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
    color:var(--text-muted);margin-bottom:.75rem;
  }

  /* Rec cards */
  .rec-card {
    border-radius:12px;padding:1rem 1.1rem;margin-bottom:.65rem;
    border:1.5px solid transparent;
  }
  .rec-card.tier-primary { background:#F5EDF9;border-color:#DCC6EC; }
  .rec-card.tier-secondary { background:#FFF3EE;border-color:#F9CBBA; }
  .rec-card.tier-feature { background:#EEF2F9;border-color:#C8D4EC; }

  .rec-head { display:flex;align-items:center;gap:8px;margin-bottom:.3rem; }
  .rec-badge {
    font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;
    letter-spacing:.04em;text-transform:uppercase;
  }
  .badge-agent { background:var(--plum);color:#fff; }
  .badge-feature { background:var(--coral);color:#fff; }
  .badge-pro { background:var(--navy);color:#fff; }
  .rec-title { font-size:14px;font-weight:700;color:var(--text-primary); }
  .rec-body { font-size:13px;color:var(--text-secondary);line-height:1.5; }
  .rec-caveat { font-size:12px;color:var(--text-muted);margin-top:.3rem;font-style:italic; }

  .restart-row { text-align:center;margin-top:1.25rem; }
  .footer { text-align:center;margin-top:1rem;font-size:12px;color:var(--text-muted); }
  .footer span { color:var(--plum);font-weight:600; }
</style>
</head>
<body>

<div class="wrap">
  <div class="top-band">
    <div class="brand-row">
      <div class="brand-dot"></div>
      <span class="brand-label">HubSpot Contracts · New Hire Training</span>
    </div>
    <div class="quiz-title">Which AI Agent Should You Recommend?</div>
    <div class="quiz-sub">Answer 4 quick questions about your customer and get a personalized recommendation.</div>
  </div>

  <div class="card">
    <div id="quiz-screen">
      <div class="progress-wrap">
        <div class="progress-meta">
          <span class="q-counter" id="q-counter">Question 1 of 4</span>
        </div>
        <div class="progress-track"><div class="progress-fill" id="prog" style="width:0%"></div></div>
      </div>
      <div class="q-text" id="q-text"></div>
      <div class="q-hint" id="q-hint"></div>
      <div id="options"></div>
      <div class="err" id="err"></div>
      <div class="nav">
        <button class="btn btn-ghost" id="back-btn" onclick="back()" style="display:none">← Back</button>
        <button class="btn btn-primary" id="next-btn" onclick="next()">Next →</button>
      </div>
    </div>
    <div id="result-screen" style="display:none"></div>
    <div class="footer">Powered by <span>HubSpot Contracts Team</span></div>
  </div>
</div>

<script>
const questions = [
  {
    q: "Which HubSpot Hubs does the customer have?",
    hint: "Select all that apply.",
    type: "multi",
    opts: [
      { label: "Marketing Hub", sub: "Email, campaigns, lead gen", key: "marketing" },
      { label: "Sales Hub", sub: "CRM, deals, sequences", key: "sales" },
      { label: "Content Hub", sub: "CMS, blog, landing pages", key: "content" },
      { label: "Service Hub", sub: "Tickets, knowledge base, CS", key: "service" },
      { label: "Data Hub (Operations Hub)", sub: "Data sync, automation, quality", key: "data" },
    ]
  },
  {
    q: "What tier are the customer's active Hubs?",
    hint: "Select the highest tier they have on any Hub.",
    type: "single",
    opts: [
      { label: "Starter", sub: "Basic features, limited automation", key: "starter" },
      { label: "Professional", sub: "Advanced automation, reporting", key: "professional" },
      { label: "Enterprise", sub: "Full feature set, custom objects, advanced AI", key: "enterprise" },
      { label: "Not sure yet", sub: "", key: "unknown" },
    ]
  },
  {
    q: "How would you describe the customer's AI maturity?",
    hint: "Pick the option that best fits.",
    type: "single",
    opts: [
      { label: "AI curious 🌱", sub: "Haven't used AI tools yet, open to exploring", key: "low" },
      { label: "AI experimenting 🔬", sub: "Using some AI features, not fully adopted", key: "mid" },
      { label: "AI-first 🚀", sub: "AI is central to their workflow and strategy", key: "high" },
    ]
  },
  {
    q: "What is the customer's biggest pain point right now?",
    hint: "Select all that apply.",
    type: "multi",
    opts: [
      { label: "Finding the right buyers", sub: "Prospecting, ICP targeting, intent signals", key: "prospecting" },
      { label: "Sales efficiency", sub: "Note-taking, follow-ups, deal progression", key: "sales_efficiency" },
      { label: "Data quality", sub: "Dirty CRM data, missing fields, enrichment", key: "data_quality" },
      { label: "Marketing contacts & data cleanup", sub: "Duplicate contacts, bad formatting, missing fields in marketing database", key: "marketing_cleanup" },
      { label: "Personalization at scale", sub: "Outreach, content, engagement", key: "personalization" },
      { label: "Deal intelligence", sub: "Forecasting, risk signals, coaching", key: "deal_intel" },
    ]
  }
];

let current = 0;
let answers = [[], null, null, []]; // q1 multi, q2 single, q3 single, q4 multi

function render() {
  const q = questions[current];
  document.getElementById('q-counter').textContent = `Question ${current + 1} of ${questions.length}`;
  document.getElementById('prog').style.width = `${((current) / questions.length) * 100}%`;
  document.getElementById('q-text').textContent = q.q;
  document.getElementById('q-hint').textContent = q.hint || '';
  document.getElementById('err').textContent = '';
  document.getElementById('back-btn').style.display = current > 0 ? 'inline-flex' : 'none';
  document.getElementById('next-btn').textContent = current === questions.length - 1 ? 'See recommendations →' : 'Next →';

  const c = document.getElementById('options');
  c.innerHTML = '';

  q.opts.forEach((o, i) => {
    const isSelected = q.type === 'multi'
      ? (answers[current] || []).includes(o.key)
      : answers[current] === o.key;

    const d = document.createElement('div');
    d.className = 'option' + (q.type === 'multi' ? ' multi' : '') + (isSelected ? ' selected' : '');
    const ctrl = q.type === 'multi'
      ? `<div class="check-box">${isSelected ? '' : ''}</div>`
      : `<div class="radio-dot"></div>`;
    d.innerHTML = `${ctrl}<div><div class="option-text">${o.label}</div>${o.sub ? `<div class="option-sub">${o.sub}</div>` : ''}</div>`;
    d.onclick = () => select(o.key, q.type);
    c.appendChild(d);
  });
}

function select(key, type) {
  if (type === 'multi') {
    if (!answers[current]) answers[current] = [];
    const idx = answers[current].indexOf(key);
    if (idx > -1) answers[current].splice(idx, 1);
    else answers[current].push(key);
  } else {
    answers[current] = key;
  }
  document.getElementById('err').textContent = '';
  render();
}

function next() {
  const q = questions[current];
  const ans = answers[current];
  const empty = q.type === 'multi' ? (!ans || ans.length === 0) : !ans;
  if (empty) { document.getElementById('err').textContent = 'Please select at least one option to continue.'; return; }
  if (current < questions.length - 1) { current++; render(); }
  else showResult();
}

function back() {
  if (current > 0) { current--; render(); }
}

function showResult() {
  document.getElementById('prog').style.width = '100%';
  const hubs   = answers[0] || [];
  const tier   = answers[1];
  const aiLevel= answers[2];
  const pain   = answers[3] || [];

  const hasSales    = hubs.includes('sales');
  const hasMarketing= hubs.includes('marketing');
  const hasContent  = hubs.includes('content');
  const hasService  = hubs.includes('service');
  const hasData     = hubs.includes('data');
  const isPro       = tier === 'professional' || tier === 'enterprise';
  const isEnterprise= tier === 'enterprise';
  const isStarter   = tier === 'starter';
  const aiHigh      = aiLevel === 'high';
  const aiMid       = aiLevel === 'mid' || aiHigh;
  const aiLow       = aiLevel === 'low';

  // ─── CUSTOMER-FACING AGENT RULE ───────────────────────────────────────────
  // Customer Agent and Prospecting Agent face the customer's end users directly.
  // Best results require AI readiness on the customer side.
  // Low/mid maturity → still surfaceable but flagged with discovery questions.
  const customerFacingAgents = ['customer_agent', 'prospecting_agent'];
  const needsDiscovery = id => customerFacingAgents.includes(id) && !aiHigh;

  // ─── DISCOVERY QUESTIONS (customer-facing agents) ───────────────────────
  const discoveryQs = {
    customer_agent: [
      "What percentage of your support tickets are repetitive or FAQ-type questions?",
      "Do you have a knowledge base, help articles, or documented responses your team uses today?",
      "How do your end customers prefer to reach support — chat, email, WhatsApp?",
      "How would your customers feel if an AI answered before a human — is that aligned with your brand?",
      "Do you have a defined escalation process for when the agent can't resolve an issue?"
    ],
    prospecting_agent: [
      "Does your team have a clearly defined Ideal Customer Profile (ICP) with firmographic criteria?",
      "How comfortable are your reps with AI-generated outreach going out under their name without full manual review?",
      "Do you currently have contact enrichment sources like ZoomInfo, Apollo, or Surfe in your tech stack?",
      "Is your outbound process built in HubSpot today — sequences, enrollment, follow-up?",
      "How do you currently qualify leads before handing them to a sales rep?"
    ]
  };

  // ─── AGENT CATALOGUE ─────────────────────────────────────────────────────
  // Scores: hard -999 = blocked (wrong hub/tier). Positive = eligible, ranked by fit.
  const catalogue = [

    // ── AEO ──────────────────────────────────────────────────────────────────
    {
      id: 'aeo',
      title: "AEO — Answer Engine Optimization",
      customerFacing: false,
      why() {
        if (hasMarketing && isPro && aiHigh) return "Marketing Hub Pro + AI-first = ideal AEO adopter. CRM-powered prompts + Content Agent integration make this a high-confidence recommendation.";
        if (hasMarketing && isPro)           return "Marketing Hub Pro unlocks the full AEO suite — CRM prompt suggestions and one-click Content Agent drafts.";
        if (hasMarketing || hasContent)      return "Content/Marketing Hub customer — AEO directly improves their AI search visibility and content ROI.";
        return "AEO is available standalone; confirm they have content or marketing goals before pitching.";
      },
      body: "Tracks how the customer's brand shows up in ChatGPT, Gemini, and Perplexity. Delivers a visibility score, competitor share of voice, citation analysis, weekly trend alerts, and prioritized plain-language recommendations. Integrates with Content Agent (Marketing Hub Pro+) to turn any AEO recommendation into a research-backed content draft in one click.",
      caveat: isPro && hasMarketing
        ? "✓ Built into Marketing Hub Pro/Enterprise — CRM-powered prompt suggestions included."
        : "Available standalone at $50/month (14-day free trial, no HubSpot subscription required). Includes 25 prompts across ChatGPT, Perplexity, and Gemini.",
      badge: "badge-agent", cardClass: "tier-primary",
      score() {
        if (!hasMarketing && !hasContent) return -999;
        let s = 3;
        if (hasMarketing)              s += 5;
        if (hasContent)                s += 2;
        if (isPro)                     s += 3;
        if (aiHigh)                    s += 4;
        if (aiMid)                     s += 2;
        if (pain.includes('prospecting'))     s += 2;
        if (pain.includes('personalization')) s += 2;
        return s;
      }
    },

    // ── CUSTOMER AGENT ────────────────────────────────────────────────────────
    {
      id: 'customer_agent',
      title: "Customer Agent",
      customerFacing: true,
      why() {
        if (hasService && isPro && aiHigh) return "Service Hub Pro + AI-first = highest-confidence recommendation. Customer is ready to deploy immediately.";
        if (hasService && aiHigh)          return "Service Hub + AI-first maturity — deploy with confidence. Reaches 65% avg resolution rate, top teams hit 90%.";
        if (hasService && aiMid)           return "Service Hub is a strong foundation — run discovery to confirm their end-customers are ready for AI-first support.";
        if (hasService)                    return "Service Hub present but low AI maturity — discovery questions are essential before recommending.";
        if (aiHigh)                        return "AI-first customer — can work across any Pro/Enterprise Hub, not just Service. Worth exploring.";
        return "Could be a fit — do discovery to validate readiness before pitching.";
      },
      body: "An AI support agent trained on the customer's knowledge base, website, and uploaded content. Responds across live chat, WhatsApp, Facebook Messenger, email, and Calling (BETA). Handles lead qualification, meeting booking, CRM updates, and next-best actions. Confidence-based responses with source citations; escalates to humans when needed. Achieves 65% avg resolution rate (top teams: 90%).",
      caveat: isPro
        ? "✓ Available on any Pro/Enterprise Hub (Marketing, Sales, Service, Data, Content, Smart CRM, Commerce). Pricing: 50 credits per resolution. 14-day free trial."
        : "⚠️ Requires any Pro or Enterprise subscription. Starter plan does not include Customer Agent.",
      badge: "badge-agent", cardClass: "tier-primary",
      score() {
        if (isStarter) return -999; // not available on Starter
        let s = 2;
        if (hasService)   s += 5;
        if (isPro)        s += 3;
        if (aiHigh)       s += 5; // customer-facing — AI maturity critical
        if (aiMid)        s += 1;
        if (aiLow)        s -= 3;
        if (pain.includes('sales_efficiency')) s += 2;
        if (isEnterprise) s += 2;
        if (!hasService)  s -= 1;
        return s;
      }
    },

    // ── SALES COACH AGENT ────────────────────────────────────────────────────
    {
      id: 'sales_coach',
      title: "Sales Coach Agent",
      customerFacing: false,
      why() {
        if (pain.includes('deal_intel') && pain.includes('sales_efficiency')) return "Deal intelligence + sales efficiency pain = Sales Coach covers both — coaching, CRM guidance, and playbook adoption in one agent.";
        if (pain.includes('deal_intel'))        return "Deal intelligence gap — Sales Coach surfaces risks, guides reps through deal stages, and can be trained on your own methodology.";
        if (pain.includes('sales_efficiency'))  return "Sales efficiency pain — Sales Coach gets reps to value faster in Sales Hub and reduces onboarding friction.";
        if (hasSales)                           return "Sales Hub customer — Sales Coach is available right now from the Breeze Marketplace at no extra credit cost.";
        return "Available on Starter+ — worth surfacing even without Sales Hub for teams wanting AI coaching.";
      },
      body: "A pre-configured Breeze Assistant available in the Breeze Marketplace. Coaches reps on Sales Hub workflows and selling best practices out of the box. Can be cloned and customized with your own playbooks, methodology documents, and brand materials. Answers sales questions using CRM data and uploaded content. Positioned as a key CS team enablement tool alongside Customer Agent.",
      caveat: "✓ Available on Starter+ via Breeze Marketplace — does not currently consume HubSpot Credits. Requires Breeze Studio permission to customize. Can be trained on internal documents and processes.",
      badge: "badge-agent", cardClass: "tier-secondary",
      score() {
        // No hard block — available Starter+
        let s = 3;
        if (hasSales)                          s += 4;
        if (pain.includes('deal_intel'))       s += 4;
        if (pain.includes('sales_efficiency')) s += 4;
        if (aiMid)  s += 2;
        if (aiHigh) s += 1;
        if (!hasSales) s -= 1;
        return s;
      }
    },

    // ── PROSPECTING AGENT ────────────────────────────────────────────────────
    {
      id: 'prospecting_agent',
      title: "Prospecting Agent",
      customerFacing: true,
      why() {
        if (hasSales && isPro && aiHigh && pain.includes('prospecting')) return "Sales Hub Pro + AI-first + prospecting pain = perfect fit. Immediate pipeline impact — integrates with Buyer Intent for fully automated enrollment.";
        if (hasSales && isPro && aiHigh)   return "Sales Hub Pro + AI-first — Prospecting Agent will feel natural. Reps approve outreach; AI handles the research and drafting.";
        if (hasSales && isPro && aiMid)    return "Sales Hub Pro with growing AI experience — run discovery to confirm rep comfort with AI-drafted outreach before recommending.";
        if (hasSales && isPro)             return "Tier is unlocked — but low AI maturity means reps may push back on AI-drafted outreach. Surface as a near-term goal with discovery.";
        if (hasSales && !isPro)            return "Great upsell angle: Sales Hub present but needs upgrade to Pro/Enterprise to unlock this agent.";
        return null;
      },
      body: "Monitors enrolled companies for buying signals, sources contacts (CRM first, then ZoomInfo/Apollo/Surfe), researches accounts using CRM + web data, and drafts personalized outreach emails for rep review and approval before sending. Reps stay in control — no outreach goes out without approval. Integrates with Buyer Intent to auto-enroll in-market companies.",
      caveat: hasSales && isPro
        ? "✓ Available on Sales Hub Professional or Enterprise. Pricing: 100 credits per lead when outreach is recommended. 14-day free trial."
        : "⚠️ Requires Sales Hub Professional or Enterprise. " + (hasSales ? "Position as an upgrade path." : "Customer needs Sales Hub first."),
      badge: "badge-pro", cardClass: "tier-secondary",
      score() {
        if (!hasSales) return -999;
        if (!isPro)    return 2; // surfaceable as upsell only
        let s = 3;
        if (isPro)                            s += 3;
        if (aiHigh)                           s += 5; // customer-facing — AI maturity critical
        if (aiMid)                            s += 2;
        if (aiLow)                            s -= 3;
        if (pain.includes('prospecting'))     s += 5;
        if (pain.includes('personalization')) s += 2;
        return s;
      }
    },

    // ── BREEZE ASSISTANT ─────────────────────────────────────────────────────
    {
      id: 'breeze',
      title: "Breeze AI Assistant",
      customerFacing: false,
      why() {
        if (aiLow)  return "Best entry point for AI-curious customers — embedded everywhere in HubSpot, zero extra cost, immediate value. Builds the confidence needed for bigger AI investments.";
        if (aiMid)  return "Natural accelerator — Breeze amplifies whatever Hub they're already in: drafts, summaries, CRM research, meeting prep, all in one place.";
        return "Even AI-first teams get daily value from Breeze as the always-on productivity layer across every Hub.";
      },
      body: "HubSpot's conversational AI copilot embedded across the entire platform — sidebar, minibar, full-screen, and mobile app. Generates and refines emails, blog posts, social posts, and landing pages. Summarizes CRM records, calls, tickets, deals, and companies. Provides meeting prep from contact history and deal context. Answers questions using CRM data, Knowledge Base, Academy content, and connected apps (Google Workspace, Microsoft 365, Slack, Gmail). Remembers conversation preferences.",
      caveat: "✓ Included on all HubSpot plans at no extra cost — no credits required for most features. Content generation: 30x/min, 1,000x/day. Some features require connected accounts.",
      badge: "badge-agent", cardClass: "tier-primary",
      score() {
        let s = 3; // reliable baseline — available everywhere
        if (aiLow)  s += 6; // best starter for AI-curious; no risk, no cost
        if (aiMid)  s += 2;
        if (isStarter) s += 2; // often the best option when advanced agents are locked
        if (!isPro) s += 1;
        if (pain.includes('sales_efficiency'))  s += 2;
        if (pain.includes('personalization'))   s += 2;
        return s;
      }
    },

    // ── DATA AGENT + BREEZE INTELLIGENCE ─────────────────────────────────────
    {
      id: 'data_agent',
      title: "Data Agent + Data Enrichment",
      customerFacing: false,
      why() {
        if (hasData && pain.includes('data_quality')) return "Data Hub + data quality pain = direct, highest-confidence recommendation. Data Agent + Smart Properties + Enrichment work together immediately.";
        if (hasData && pain.includes('prospecting'))  return "Data Hub customer with prospecting pain — Data Agent surfaces account intelligence and enrichment fills gaps that hurt targeting.";
        if (hasData)                                   return "Data Hub customer — Data Agent adds AI-powered plain-language querying on top of their existing data infrastructure.";
        if (pain.includes('data_quality'))             return "Data quality is a stated pain — Data Enrichment is now free on Starter+ and fills missing fields automatically, no credits needed.";
        return null;
      },
      body: "Two complementary tools: Data Agent answers plain-language questions about customers using CRM data, calls, emails, and web research (uses HubSpot Credits). Data Enrichment automatically fills missing contact and company fields from HubSpot's 200M+ profile dataset — firmographics, job titles, company size — running in the background within seconds. Enriched data feeds directly into lead scoring, workflows, and segmentation.",
      caveat: hasData
        ? "✓ Full power with Data Hub. Data Enrichment: free on all Starter+ plans (no credits needed as of Spring 2026). Data Agent: uses HubSpot Credits. Smart Properties: also credit-based."
        : "✓ Data Enrichment is free on all Starter+ plans — no credits required (Spring 2026 update). Data Hub unlocks Data Agent and Smart Properties.",
      badge: "badge-agent", cardClass: "tier-primary",
      score() {
        if (!hasData && !pain.includes('data_quality') && !pain.includes('prospecting')) return -999;
        let s = 2;
        if (hasData)                           s += 5;
        if (pain.includes('data_quality'))     s += 6;
        if (pain.includes('prospecting'))      s += 3;
        if (aiMid)  s += 1;
        if (isPro)  s += 1;
        return s;
      }
    },

    // ── DATA QUALITY COMMAND CENTER ─────────────────────────────────────────
    {
      id: 'dq_command_center',
      title: "Data Quality Command Center",
      customerFacing: false,
      why() {
        if (pain.includes('marketing_cleanup') && hasMarketing && hasData && isPro) return "Marketing Hub + Data Hub Pro + cleanup priority = perfect fit. Full automation of formatting fixes and deduplication available now.";
        if (pain.includes('marketing_cleanup') && hasMarketing && hasData)          return "Marketing Hub + Data Hub customer with cleanup priority — Command Center is the right starting point.";
        if (pain.includes('marketing_cleanup') && hasMarketing)                     return "Marketing cleanup priority — Command Center works on all Starter+ plans and gives immediate visibility into data health.";
        if (pain.includes('marketing_cleanup'))                                      return "Data cleanup priority — Command Center is available Starter+ and surfaces duplicates, formatting issues, and enrichment gaps automatically.";
        if (pain.includes('data_quality'))                                           return "Data quality pain — Command Center is the centralized starting point for AI-driven cleanup.";
        return null;
      },
      body: "The central hub for AI-driven CRM cleanup, available on all Starter+ plans. Powered by Breeze, it automatically detects duplicate contacts and companies (scans every 24 hours, surfaces pairs for review or auto-merge), fixes formatting issues (capitalizations, combined name fields, spacing, punctuation — e.g. 'JOHN SMITH' → 'John Smith'), tracks per-property enrichment fill rates so you can see exactly what's missing, and sends weekly digest emails with proactive alerts before issues cascade into campaigns.",
      caveat: isPro && hasData
        ? "✓ Full Data Quality Command Center on Data Hub Pro/Enterprise — formatting fixes are automatable. Limited version available on all Starter+ plans."
        : "✓ Limited version available on all Starter+ plans. Full automation (formatting fix workflows) requires Data Hub Pro/Enterprise.",
      badge: "badge-agent", cardClass: "tier-primary",
      score() {
        if (!pain.includes('marketing_cleanup') && !pain.includes('data_quality')) return -999;
        let s = 4;
        if (pain.includes('marketing_cleanup')) s += 6;
        if (pain.includes('data_quality'))      s += 4;
        if (hasMarketing)  s += 3;
        if (hasData)       s += 3;
        if (isPro)         s += 2;
        if (aiLow || aiMid) s += 2; // great for early AI adopters — no AI maturity needed
        return s;
      }
    },

    // ── DATA AGENT (MARKETING CLEANUP STACK) ─────────────────────────────────
    {
      id: 'data_agent_marketing',
      title: "Data Agent — Advanced Marketing Cleanup",
      customerFacing: false,
      why() {
        if (pain.includes('marketing_cleanup') && aiHigh && hasData) return "AI-first + Data Hub + marketing cleanup = full power. Smart Properties and Smart Actions can automate classification and segmentation end-to-end.";
        if (pain.includes('marketing_cleanup') && aiHigh)            return "AI-first customer with cleanup priority — Data Agent's Smart Properties and Smart Actions go beyond enrichment to answer custom questions per record.";
        if (pain.includes('marketing_cleanup') && aiMid)             return "Growing AI adoption + marketing cleanup priority — Data Agent is the natural next step after the Command Center stabilizes the database.";
        if (pain.includes('marketing_cleanup'))                       return "Marketing cleanup priority with early AI maturity — position Data Agent as the advanced layer to unlock once the team is comfortable with Breeze.";
        return null;
      },
      body: "For teams with larger or complex databases (50K+ contacts, messy imports, Salesforce syncs, multi-brand environments). Goes beyond standard enrichment by creating Smart Properties that answer custom questions per record — e.g. 'Is this a marketing contact or an internal system user?' — and writes the answer directly to a CRM field for workflow-based segmentation. Runs Smart Actions in workflows to auto-classify, auto-tag, or flip marketing contact status based on AI-derived logic. Pulls from web research, company websites, call transcripts, and CRM data to fill context that enrichment alone can't provide.",
      caveat: "Available on all Starter+ plans. Requires HubSpot Credits (Data Agent uses credits per action). Best positioned as the advanced layer on top of the Data Quality Command Center.",
      badge: "badge-agent", cardClass: "tier-secondary",
      score() {
        if (!pain.includes('marketing_cleanup')) return -999;
        let s = 3;
        if (aiHigh) s += 6; // AI-fully-adopted track — this is the advanced layer
        if (aiMid)  s += 3;
        if (aiLow)  s -= 2; // not ready for this complexity yet
        if (hasData)       s += 3;
        if (hasMarketing)  s += 2;
        if (isPro)         s += 2;
        return s;
      }
    }
  ];

  // ─── SCORE + RANK → TOP 2 ────────────────────────────────────────────────
  catalogue.forEach(a => { a._score = a.score(); });
  const eligible = catalogue.filter(a => a._score > -999);
  eligible.sort((a, b) => b._score - a._score);
  const topAgents = eligible.slice(0, 2);

  // ─── SHORTENED AGENT BODIES ──────────────────────────────────────────────
  // Override body text with concise 2-line summaries for results display
  const shortBodies = {
    aeo:                  "Tracks how the brand shows up in ChatGPT, Gemini & Perplexity. Delivers visibility scores, competitor share of voice, citation gaps, and prioritized fix recommendations.",
    customer_agent:       "AI support agent trained on the customer's content. Responds across chat, email & WhatsApp, qualifies leads, books meetings, updates CRM, and escalates to humans when needed. Avg 65% resolution rate.",
    sales_coach:          "Pre-configured Breeze assistant from the Marketplace. Coaches reps on Sales Hub workflows and selling best practices. Customizable with your own playbooks, methodology, and CRM data — no credits.",
    prospecting_agent:    "Monitors accounts for buying signals, sources contacts, and drafts personalized outreach for rep approval before anything sends. Integrates with Buyer Intent for auto-enrollment.",
    breeze:               "AI copilot embedded across all HubSpot Hubs. Drafts emails, summarizes records, preps meetings, answers questions from CRM data and connected apps. Free on all plans.",
    data_agent:           "AI-powered enrichment and querying: answers plain-language questions about customers from CRM data, fills missing fields automatically. Enrichment free Starter+ (Spring 2026); Data Agent uses credits.",
    dq_command_center:    "Central AI cleanup hub: detects duplicates every 24hrs, fixes formatting (e.g. JOHN SMITH → John Smith), tracks per-property fill rates, and sends weekly digest alerts. Available Starter+.",
    data_agent_marketing: "Advanced layer for complex databases (50K+ contacts, SFDC syncs, multi-brand). Creates Smart Properties that answer custom questions per record and runs Smart Actions to auto-classify contacts. Uses credits."
  };

  // ─── TOOLS CATALOGUE ─────────────────────────────────────────────────────
  // Tools are safe for all AI maturity levels — no customer-facing actions.
  // Each tool has: pain trigger(s), AI maturity gate, availability, short body.
  const allTools = [
    {
      pains: ['prospecting'],
      aiGate: null, // all maturity levels
      title: "Identify Buyer Intent",
      avail: "All Starter+ plans · 10 credits/company/month",
      body: "Identifies companies visiting your website and researching related topics before filling a form. Tracks 16+ signals (funding, hiring, job changes). Auto-adds companies to CRM, segments, or workflows. Buyer Intent card surfaces on company records."
    },
    {
      pains: ['prospecting', 'personalization'],
      aiGate: null,
      title: "Personalized Outreach",
      avail: "Sales Hub Pro/Enterprise · 100 credits per lead",
      body: "AI researches accounts, sources contacts (CRM first, then ZoomInfo/Apollo/Surfe), and drafts tailored outreach for rep review. Rep approves every email before it sends — AI handles research and writing."
    },
    {
      pains: ['sales_efficiency'],
      aiGate: null,
      title: "Notetaker",
      avail: "Sales Hub Pro+ / Service Hub Pro+ · Included, no extra cost",
      body: "AI bot that auto-joins Zoom, Google Meet, and Teams meetings. Records, transcribes, extracts action items, drafts follow-ups, and auto-associates transcripts to CRM records. Powers Smart Deal Progression."
    },
    {
      pains: ['sales_efficiency'],
      aiGate: null,
      title: "AI-Assisted Follow-Up",
      avail: "Sales Hub Pro+ / Service Hub Pro+ · Included, no credits needed",
      body: "Drafts personalized follow-up emails immediately after a call, pulling from the transcript AND full deal history. Rep reviews before sending. Also surfaces after high-signal emails."
    },
    {
      pains: ['deal_intel', 'sales_efficiency'],
      aiGate: null,
      title: "Smart Deal Progression",
      avail: "Sales Hub Pro+ / Service Hub Pro+ · Included · Custom properties: 10 credits each",
      body: "Turns transcripts and emails into suggested CRM updates (stage, amount, close date, next step) for rep review. Surfaces action items with citations, drafts follow-ups, and tracks Deal Plans collaboratively."
    },
    {
      pains: ['deal_intel'],
      aiGate: null,
      title: "Deal Intelligence",
      avail: "Sales Hub Pro+ / Service Hub Pro+ · Included with Smart Deal Progression",
      body: "Surfaces deal risks, buyer goals, health scores, and Next Best Actions on deal records and in meeting prep. Gives managers pipeline risk flags and per-rep coaching recommendations."
    },
    {
      pains: ['data_quality', 'marketing_cleanup'],
      aiGate: null, // great for early adopters — passive, no customer-facing action
      title: "Data Enrichment",
      avail: "✓ Free on all Starter+ plans · No HubSpot Credits required (Spring 2026)",
      body: "Automatically fills missing contact and company properties from HubSpot's 200M+ profile dataset. Runs in the background within seconds. New Intelligence Tab: view and apply enrichment in one click. Feeds lead scoring, workflows, and segmentation."
    },
    {
      pains: ['marketing_cleanup'],
      aiGate: null, // specifically designed for early adopters
      title: "Data Quality Command Center",
      avail: "All Starter+ plans · Full automation requires Data Hub Pro/Enterprise",
      body: "Central hub for AI-driven CRM cleanup. Detects duplicates every 24hrs, fixes formatting issues (JOHN SMITH → John Smith), tracks per-property enrichment fill rates, and sends weekly digest alerts before issues cascade into campaigns."
    },
  ];

  // Build tool recommendations: match pain points, respect AI gate, deduplicate, cap at 3
  const tools = [];
  const seenT = new Set();
  for (const t of allTools) {
    const painMatch = t.pains.some(p => pain.includes(p));
    const gateOk = !t.aiGate || (t.aiGate === 'mid' ? aiMid : aiHigh);
    if (painMatch && gateOk && !seenT.has(t.title)) {
      seenT.add(t.title);
      tools.push(t);
      if (tools.length === 3) break;
    }
  }

  // ─── HEADLINE ────────────────────────────────────────────────────────────
  const top1 = topAgents[0];
  let headline, headlineSub;
  if (aiHigh && isPro) {
    headline = "This customer is ready for the full AI stack 🚀";
    headlineSub = `Lead with <strong>${top1.title}</strong> — their tier and AI maturity make this your highest-confidence recommendation.`;
  } else if (aiMid) {
    headline = "Strong AI adoption potential 🔬";
    headlineSub = `They're experimenting. <strong>${top1.title}</strong> is the right accelerator — run discovery where flagged to sharpen your pitch.`;
  } else {
    headline = "Start simple, build confidence 🌱";
    headlineSub = `AI-curious customer. Lead with <strong>${top1.title}</strong> — zero friction, immediate value, and opens the door to bigger conversations.`;
  }

  // ─── RENDER ──────────────────────────────────────────────────────────────
  let html = `<div class="result-header">
    <div class="result-emoji">🎯</div>
    <div class="result-title">${headline}</div>
    <div class="result-sub">${headlineSub}</div>
  </div>`;

  // Agents section
  html += `<div class="section-label">Your Top 2 Agent Recommendations</div>`;
  topAgents.forEach((r, i) => {
    const whyText = r.why();
    const showDiscovery = needsDiscovery(r.id);
    const qs = discoveryQs[r.id] || [];
    const displayBody = shortBodies[r.id] || r.body;
    html += `<div class="rec-card ${r.cardClass}" style="${showDiscovery ? 'border-color:#F0C97A;background:#FFFBF0;' : ''}">
      <div class="rec-head">
        <span class="rec-badge ${r.badge}">${i === 0 ? '⭐ Best fit' : '2nd pick'}</span>
        <span class="rec-title">${r.title}</span>
        ${showDiscovery ? `<span style="font-size:11px;font-weight:700;background:#FFF4D6;color:#9A6200;padding:2px 8px;border-radius:20px;margin-left:6px;">⚠️ Ask first</span>` : ''}
      </div>
      ${whyText ? `<div style="font-size:12px;font-style:italic;color:var(--text-muted);margin-bottom:.4rem;">💡 ${whyText}</div>` : ''}
      <div class="rec-body">${displayBody}</div>
      ${r.caveat ? `<div class="rec-caveat" style="margin-top:.4rem;">${r.caveat}</div>` : ''}
      ${showDiscovery && qs.length ? `
        <div style="margin-top:.85rem;padding-top:.85rem;border-top:1.5px dashed #F0C97A;">
          <div style="font-size:11px;font-weight:700;color:#9A6200;letter-spacing:.05em;text-transform:uppercase;margin-bottom:.6rem;">🗣 Ask these questions first</div>
          <ol style="margin-left:1.1rem;">
            ${qs.map(q => `<li style="font-size:13px;color:var(--text-secondary);line-height:1.6;margin-bottom:.4rem;">${q}</li>`).join('')}
          </ol>
          <div style="font-size:12px;color:var(--text-muted);margin-top:.6rem;font-style:italic;">⚡ This agent faces end users directly. Confirm readiness before committing to a deployment timeline.</div>
        </div>` : ''}
    </div>`;
  });

  // Tools section — only shown when there are matched tools
  if (tools.length > 0) {
    html += `<div class="section-label" style="margin-top:1.25rem">Recommended Tools${aiLow ? ' — Great Starting Points for Early Adopters' : ''}</div>`;
    tools.forEach(t => {
      html += `<div class="rec-card tier-feature">
        <div class="rec-head">
          <span class="rec-badge badge-feature">🛠 Tool</span>
          <span class="rec-title">${t.title}</span>
          ${!t.aiGate ? `<span style="font-size:10px;font-weight:700;background:#E6F7EE;color:#1a7a47;padding:2px 7px;border-radius:20px;margin-left:6px;">All AI levels</span>` : ''}
        </div>
        <div class="rec-body">${t.body}</div>
        <div class="rec-caveat" style="margin-top:.3rem;">📋 ${t.avail}</div>
      </div>`;
    });
  }

  html += `<div class="restart-row"><button class="btn btn-ghost" onclick="restart()">↺ Try another customer profile</button></div>`;

  document.getElementById('quiz-screen').style.display = 'none';
  const rs = document.getElementById('result-screen');
  rs.innerHTML = html;
  rs.style.display = 'block';
}

function restart() {
  current = 0;
  answers = [[], null, null, []];
  document.getElementById('result-screen').style.display = 'none';
  document.getElementById('quiz-screen').style.display = 'block';
  render();
}

render();
</script>
</body>
</html>
